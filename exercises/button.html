<!DOCTYPE html>
<html>
<head>
    <title>Button Clicker</title>
</head>

<body>

    <h1>Clicks: <span id="score">0</span></h1>

    <img
        id="button"
        src="button.png"
        width="300"
        onclick="clickCookie()"
    >

    <script>
        let cookies = 0;

        function clickCookie() {
            cookies++;
            document.getElementById("score").textContent = cookies;
        }
    </script>

</body>
</html>
