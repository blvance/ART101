<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Environment 03: Forest Data Layer</title>
    <link rel="stylesheet" href="env03.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="env03.js" defer></script>
</head>
<body>
    <main class="forest-scene">
        <h1>Environment 03: The Listening Ridge</h1>
        <p class="introduction">
            The trail narrows, the mist thickens, and a watchful glow waits at the edge of the trees.
            The forest is not silent — it is attentive.
        </p>

        <div class="control-panel">
            <button id="show-title">Show title</button>
            <button id="show-elements">Show elements</button>
            <button id="show-entity">Show main entity</button>
            <button id="count-clicks">Count trail checks</button>
        </div>

        <div id="environment-output" aria-live="polite"></div>
    </main>
</body>
</html>
