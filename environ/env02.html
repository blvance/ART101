<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Environment 02: Into the Mist</title>
    <link href="env02.css" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="forest-scene">
        <h1>Into the Mist</h1>
        <p class="introduction">
            A quiet forest trail disappears into the fog. A rider pauses beneath the trees,
            with only the path ahead and the sounds of the woods for company.
        </p>

        <div class="atmosphere-zone" aria-label="Forest atmosphere">
            <span class="moon" id="moon" aria-label="Pale moon">◐</span>
            <span class="mist mist-one" id="mist-one" aria-hidden="true"></span>
            <span class="mist mist-two" id="mist-two" aria-hidden="true"></span>
            <span class="fireflies" id="fireflies" aria-label="Fireflies">✦　·　✧　·　✦</span>
            <span class="canopy" id="canopy" aria-hidden="true">♠　♣　♠　♣　♠</span>
        </div>

        <div class="main-zone" aria-label="Mountain biker resting on the forest trail">
            <div class="trail-marker" id="trail-marker">
                <span aria-hidden="true">🪨</span>
                <p>Old trail marker</p>
            </div>
            <figure class="rider" id="rider">
                <img src="mtb.png" alt="A mountain biker on a forest trail">
                <figcaption>The trail goes on.</figcaption>
            </figure>
            <div class="forest-tree" id="forest-tree" aria-label="Tall pine tree">
                <span aria-hidden="true">🌲</span>
                <p>Watchful pines</p>
            </div>
        </div>

        <p class="social"><a class="instagram-link" href="https://www.instagram.com/brodyvance.1/">Follow my Instagram</a></p>
    </main>
</body>
</html>
